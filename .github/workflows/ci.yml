name: Automata CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - develop
      - main

jobs:
  lint-build-test:
    name: Lint, Build & Test (backend + dashboard)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/automata_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/automata_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      OPENAI_API_KEY: "sk-fake-key-for-testing"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      JWT_SECRET: "ci-jwt-secret-testing"
      META_APP_ID: "123456"
      META_APP_SECRET: "ci-app-secret"
      META_VERIFY_TOKEN: "ci-verify-token"

    steps:
      - name: 1. Checkout Código
        uses: actions/checkout@v4

      - name: 2. Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Cache de Node Modules (Monorepo / Root + Dashboard)
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dashboard/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 4. Instalación de Dependencias
        run: |
          npm ci
          cd dashboard && npm ci

      - name: 5. Esquema de Base de Datos (db push contra Postgres de CI)
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: 6. Generar Cliente Prisma
        run: npx prisma generate

      - name: 7. Compilación y Types del Backend (tsc)
        run: npx tsc --noEmit

      - name: 8. Tests del Backend (unit + integration)
        run: npx vitest run src/test

      - name: 9. Build del Dashboard (type-check incluido)
        run: |
          cd dashboard
          npm run build

      - name: 10. Tests del Dashboard
        run: |
          cd dashboard
          npx vitest run
